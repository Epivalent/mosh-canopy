name: Publish Mosh Canopy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check feature dependencies before replacing the live app
        run: node .github/scripts/check-launch.mjs https://epivalent.github.io/mosh-canopy/ --build .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published Dream model paths and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node .github/scripts/check-dream.mjs "$SITE_URL"
      - name: Verify preview metadata references and browser access
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node .github/scripts/check-previews.mjs "$SITE_URL"
      - name: Verify playback and search dependencies after deployment
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node .github/scripts/check-launch.mjs "$SITE_URL"
